<!DOCTYPE html>
<html>
<head>
    <title><h1>AI Chatbot using DevOps - Version 2</h1></title>
</head>
<body>

    <h1>AI Chatbot using DevOps</h1>

    <form method="POST">
        <input type="text" name="message" placeholder="Enter message">
        <button type="submit">Send</button>
    </form>

    <h3>User:</h3>
    <p>{{ user_message }}</p>

    <h3>Bot:</h3>
    <p>{{ bot_reply }}</p>

</body>
</html>
