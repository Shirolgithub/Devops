<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Chatbot using DevOps - Version 2</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(-45deg,#0f172a,#1e293b,#0ea5e9,#2563eb);
    background-size:400% 400%;
    animation:bgAnimation 15s ease infinite;
}

@keyframes bgAnimation{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.container{
    width:90%;
    max-width:900px;
    padding:40px;
    border-radius:25px;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    animation:fadeIn 1.5s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    text-align:center;
    color:white;
    margin-bottom:25px;
    font-size:2.5rem;
    text-shadow:0 0 20px #38bdf8;
}

.subtitle{
    text-align:center;
    color:#e2e8f0;
    margin-bottom:30px;
}

form{
    display:flex;
    gap:10px;
    margin-bottom:25px;
}

input[type="text"]{
    flex:1;
    padding:15px;
    border:none;
    border-radius:12px;
    outline:none;
    font-size:16px;
    background:rgba(255,255,255,0.15);
    color:white;
}

input[type="text"]::placeholder{
    color:#cbd5e1;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:linear-gradient(45deg,#06b6d4,#3b82f6);
    color:white;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 0 20px #38bdf8;
}

.chat-box{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.message{
    padding:18px;
    border-radius:15px;
    animation:slideUp 0.8s ease;
}

.user{
    background:rgba(34,197,94,0.2);
    border-left:5px solid #22c55e;
    color:white;
}

.bot{
    background:rgba(59,130,246,0.2);
    border-left:5px solid #3b82f6;
    color:white;
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.label{
    font-weight:bold;
    margin-bottom:8px;
}

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    animation:float 20s infinite linear;
}

.circle:nth-child(1){
    width:120px;
    height:120px;
    left:10%;
    top:20%;
}

.circle:nth-child(2){
    width:200px;
    height:200px;
    right:10%;
    bottom:10%;
}

.circle:nth-child(3){
    width:80px;
    height:80px;
    left:70%;
    top:10%;
}

@keyframes float{
    0%{
        transform:translateY(0px) rotate(0deg);
    }
    50%{
        transform:translateY(-40px) rotate(180deg);
    }
    100%{
        transform:translateY(0px) rotate(360deg);
    }
}

.footer{
    text-align:center;
    color:#cbd5e1;
    margin-top:25px;
    font-size:14px;
}

@media(max-width:768px){

    form{
        flex-direction:column;
    }

    button{
        width:100%;
    }

    h1{
        font-size:2rem;
    }
}

</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">

    <h1>🤖 AI Chatbot using DevOps</h1>

    <p class="subtitle">
        Docker • Jenkins • Kubernetes • Monitoring • CI/CD Pipeline
    </p>

    <form method="POST">

        <input
            type="text"
            name="message"
            placeholder="Ask me anything..."
            required
        >

        <button type="submit">
            🚀 Send
        </button>

    </form>

    <div class="chat-box">

        {% if user_message %}
        <div class="message user">
            <div class="label">👤 User</div>
            {{ user_message }}
        </div>
        {% endif %}

        {% if bot_reply %}
        <div class="message bot">
            <div class="label">🤖 AI Assistant</div>
            {{ bot_reply }}
        </div>
        {% endif %}

    </div>

    <div class="footer">
        DevOps Integrated AI Chatbot | Version 2.0
    </div>

</div>

</body>
</html>
